# ─── Netlify Configuration for React (Vite) ──────────────────────
# This file tells Netlify how to handle client-side routing.
# Without this, refreshing a page other than the home page
# will result in a 404 "Page Not Found" error.
# ────────────────────────────────────────────────────────────────

[build]
  # Since this file is in the frontend folder, the base is already set to frontend
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
